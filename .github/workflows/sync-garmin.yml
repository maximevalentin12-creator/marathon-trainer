# Scheduled Garmin → Supabase import, twice a day (07:00 and 20:00 Paris time), plus manual runs.
#
# THIS REPOSITORY IS PUBLIC, SO THESE LOGS ARE PUBLIC. scripts/sync_garmin.py logs only counts, dates and error
# class names (see its docstring and scripts/test_sync_garmin.py). Do not add `env`/`set -x`/`echo` of anything else.
#
# Repository secrets to create (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_URL                 https://<project>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    the project's service_role key (this job writes activities outside any user session)
#   GARMIN_SYNC_USER_ID          your users.id (the uuid your data is stored under)
# No Garmin password is stored on GitHub: the job only RESUMES the session saved in Supabase (garmin_tokens) and never
# falls back to a credential login (GARMIN_NO_CREDENTIAL_LOGIN). Create that session once, on your own machine:
#   python scripts/sync_garmin.py --login --user-id <your uuid>

name: Sync Garmin

on:
  schedule:
    # GitHub cron is UTC and ignores daylight saving. Each Paris time is listed twice (summer and winter offset);
    # the first step lets only the run that falls on 07:xx / 20:xx Paris time continue.
    - cron: "0 5,6 * * *"
    - cron: "0 18,19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Only at 07:00 or 20:00 Paris time
        id: gate
        run: |
          hour=$(TZ=Europe/Paris date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "07" ] && [ "$hour" != "20" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not a sync hour in Paris (it is ${hour}h) — skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Log-hygiene tests (nothing sensitive may reach a public log)
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest scripts/test_sync_garmin.py

      - name: Import recent activities
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          USER_ID: ${{ secrets.GARMIN_SYNC_USER_ID }}
          GARMIN_NO_CREDENTIAL_LOGIN: "1"
          DAYS_BACK: "30"
        run: python scripts/sync_garmin.py

      - name: Fetch laps for quality sessions
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          USER_ID: ${{ secrets.GARMIN_SYNC_USER_ID }}
          GARMIN_NO_CREDENTIAL_LOGIN: "1"
        run: python scripts/sync_garmin.py --fetch-laps
